<script>
const token = localStorage.getItem("token");

// 🔥 FIX token check
if(!token || token === "undefined" || token === "null"){
  alert("Chưa đăng nhập!");
  location.href="index.html";
}

// set info
document.getElementById("user").innerText = localStorage.getItem("user");
document.getElementById("role").innerText = localStorage.getItem("role");

// hide user menu nếu không phải admin
if(localStorage.getItem("role") !== "admin"){
  document.getElementById("uLink").style.display="none";
}

// ===== API CALL =====
async function door(){
  try{
    let res = await fetch(API+"/door",{
      method:"POST",
      headers:{
        "Authorization": "Bearer " + token
      }
    });

    if(res.status === 401){
      logout();
    }

  }catch(e){
    console.error(e);
    alert("Lỗi kết nối server");
  }
}

async function light(s){
  try{
    let res = await fetch(API+"/light",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({state:s})
    });

    if(res.status === 401){
      logout();
    }

  }catch(e){
    console.error(e);
    alert("Lỗi kết nối server");
  }
}

// ===== STATUS =====
async function loadStatus(){
  try{
    let r = await fetch(API+"/status");
    let d = await r.json();
    document.getElementById("state").innerText = "Trạng thái: " + d.result;
  }catch(e){
    console.error(e);
  }
}

setInterval(loadStatus,1000);
loadStatus();

// ===== LOGOUT =====
function logout(){
  localStorage.clear();
  location.href="index.html";
}
</script>
