<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<script>
if(!localStorage.getItem("user")) location="index.html";
</script>

<div class="container">

<h2>🏠 SmartHome</h2>

<p>User: <b id="user"></b></p>

<button onclick="door()">Open Door</button>
<button onclick="light('ON')">Light ON</button>
<button onclick="light('OFF')">Light OFF</button>

<h3>Trạng thái:</h3>
<div id="state">--</div>

<a href="logs.html">Logs</a>

</div>

<script>
const API = "https://smarthome-github-io-7.onrender.com";

document.getElementById("user").innerText = localStorage.getItem("user");

async function door(){
  await fetch(API+"/door",{method:"POST"});
}

async function light(s){
  await fetch(API+"/light",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({state:s})
  });
}

async function update(){
  let r = await fetch(API+"/status");
  let d = await r.json();
  document.getElementById("state").innerText = d.result || JSON.stringify(d);
}

setInterval(update,2000);
update();
</script>

</body>
</html>
