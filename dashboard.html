<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
  <title>Dashboard</title>
</head>
<body>
<div class="wrapper">
<h2>Xin chào: <span id="user"></span></h2>

<a href="logs.html">📊 Xem Logs</a> |
<a href="users.html">👑 Quản lý user</a> |
<button onclick="logout()">Logout</button>

<hr>

<h3>Điều khiển</h3>
<label class="switch">
  <input type="checkbox" id="lightSwitch" onchange="toggleLight()">
  <span class="slider"></span>
</label>

<span id="lightStatus">Đèn đang tắt</span>

<button onclick="door()">Mở cửa</button>
</div>
<script>
const API = "https://otherguess-contracted-ezequiel.ngrok-free.dev"
// SỬA TẠI ĐÂY: Đổi tên biến thành 'me' để không trùng ID thẻ <span>
const me = localStorage.getItem("user")

if(!me){
  window.location.href = "index.html"
}

document.getElementById("user").innerText = me

function light(state){
  fetch(API + "/light", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "ngrok-skip-browser-warning": "true" // THÊM DÒNG NÀY
    },
    body: JSON.stringify({ state: state, user: me })
  })
}

function door(){
  fetch(API + "/door", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "ngrok-skip-browser-warning": "true" // THÊM DÒNG NÀY
    },
    body: JSON.stringify({ user: me })
  })
}

function logout(){
  localStorage.clear()
  window.location.href = "index.html"
}
function toggleLight(){
  const isOn = document.getElementById("lightSwitch").checked
  const state = isOn ? "ON" : "OFF"

  fetch(API + "/light", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ state: state, user: me })
  })

  document.getElementById("lightStatus").innerText = isOn
    ? "Đèn đang bật"
    : "Đèn đang tắt"
}
</script>

</body>
</html>
