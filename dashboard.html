<!doctype html>
<html>
<head>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>

<body>
<div class="container">

<div class="topbar">
  <h2>🏠 SmartHome</h2>
  <div>
    <span class="badge" id="user"></span>
    <span class="badge" id="role"></span>
  </div>
</div>

<div class="grid">

<div class="card">
  <h3>Điều khiển</h3>

  <button class="btn btn-primary" onclick="door()">🚪 Door</button>
  <button class="btn btn-soft" onclick="light('ON')">💡 ON</button>
  <button class="btn btn-ghost" onclick="light('OFF')">💡 OFF</button>

  <p id="state"></p>
</div>

<div class="card">
  <h3>Menu</h3>
  <div class="nav">
    <a href="logs.html">📜 Logs</a>
    <a href="users.html" id="uLink">👤 Users</a>
    <a href="#" onclick="logout()">🚪 Logout</a>
  </div>
</div>

</div>
</div>

<script>
const token = localStorage.getItem("token");
if(!token) location.href="index.html";

user.innerText = localStorage.getItem("user");
role.innerText = localStorage.getItem("role");

if(role.innerText !== "admin"){
  document.getElementById("uLink").style.display="none";
}

async function door(){
  await fetch(API+"/door",{
    method:"POST",
    headers:{Authorization:token}
  });
}

async function light(s){
  await fetch(API+"/light",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization:token
    },
    body: JSON.stringify({state:s})
  });
}

async function load(){
  let r = await fetch(API+"/status");
  let d = await r.json();
  state.innerText = d.result;
}

setInterval(load,1000);
load();

function logout(){
  localStorage.clear();
  location.href="index.html";
}
</script>
</body>
</html>
