<!DOCTYPE html>
<html>
<head><title>Dashboard</title><meta charset="UTF-8"></head>
<body>
    <h2>Xin chào: <span id="userDisp"></span></h2>
    <a href="log.html">📊 Nhật ký</a> | <a href="user.html">👑 Quản lý</a> | <button onclick="logout()">Thoát</button>
    <hr>
    <h3>Thiết bị</h3>
    <button onclick="sendCmd('light', 'ON')">Bật Đèn</button>
    <button onclick="sendCmd('light', 'OFF')">Tắt Đèn</button>
    <button onclick="sendCmd('door', 'OPEN')">Mở Cửa</button>

    <script>
        const API = "https://smarthome-github-io-7.onrender.com";
        const user = localStorage.getItem("user");

        if(!user) window.location.href = "index.html";
        document.getElementById("userDisp").innerText = user;

        function sendCmd(device, action) {
            fetch(API + "/control", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ 
                    device: device, 
                    action: action, 
                    user: user // Truyền user từ localStorage vào đây
                })
            }).then(res => res.json()).then(d => {
                if(d.success) console.log("Lệnh đã gửi!");
            });
        }

        function logout() { localStorage.clear(); window.location.href = "index.html"; }
    </script>
</body>
</html>
