<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
</head>
<body>

<h2>Xin chào: <span id="user"></span></h2>

<a href="log.html">📊 Xem Logs</a> |
<a href="user.html">👑 Quản lý user</a> |
<button onclick="logout()">Logout</button>

<hr>

<h3>Điều khiển</h3>
<button onclick="light('ON')">Bật đèn</button>
<button onclick="light('OFF')">Tắt đèn</button>
<button onclick="door()">Mở cửa</button>

<script>
const API = "https://smarthome-github-io-7.onrender.com"
"
const user = localStorage.getItem("user")

if(!user){
  window.location.href = "index.html"
}

document.getElementById("user").innerText = user

function light(state){
  fetch(API + "/light", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ state, user })
  })
}

function door(){
  fetch(API + "/door", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ user })
  })
}

function logout(){
  localStorage.clear()
  window.location.href = "index.html"
}
</script>

</body>
</html>
