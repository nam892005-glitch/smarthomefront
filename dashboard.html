<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
</head>
<body>

<h2>Xin chào: <span id="user"></span></h2>

<a href="logs.html">📊 Xem Logs</a> |
<a href="users.html">👑 Quản lý user</a> |
<button onclick="logout()">Logout</button>

<hr>

<h3>Điều khiển</h3>
<button onclick="light('ON')">Bật đèn</button>
<button onclick="light('OFF')">Tắt đèn</button>
<button onclick="door()">Mở cửa</button>

<script>
const API = "https://smarthome-github-io-7.onrender.com"
// SỬA TẠI ĐÂY: Đổi tên biến thành 'me' để không trùng ID thẻ <span>
const me = localStorage.getItem("user")

if(!me){
  window.location.href = "index.html"
}

document.getElementById("user").innerText = me

function light(state){
  fetch(API + "/light", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    // SỬA TẠI ĐÂY: Truyền 'me' vào trường 'user'
    body: JSON.stringify({ state: state, user: me })
  })
}

function door(){
  fetch(API + "/door", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    // SỬA TẠI ĐÂY: Truyền 'me' vào trường 'user'
    body: JSON.stringify({ user: me })
  })
}

function logout(){
  localStorage.clear()
  window.location.href = "index.html"
}
</script>

</body>
</html>
