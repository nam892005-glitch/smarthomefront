<div class="topbar">
  <h2><i class="fas fa-home"></i> SmartHome</h2>
  <div>
    <span class="badge"><i class="fas fa-user"></i> <span id="user"></span></span>
    <span class="badge" id="role" style="text-transform: uppercase;"></span>
  </div>
</div>

<div class="grid">
  <div class="card">
    <h3><i class="fas fa-sliders-h"></i> Điều khiển</h3>

      <button class="btn btn-primary" onclick="door()"><i class="fas fa-door-open"></i> Cửa</button>
      <button class="btn btn-success" onclick="light('ON')"><i class="fas fa-lightbulb"></i> Bật</button>
      <button class="btn btn-danger" onclick="light('OFF')"><i class="far fa-lightbulb"></i> Tắt</button>

    <p style="margin-top: 15px; font-weight: bold;">Trạng thái: <span id="state" style="color: var(--primary);">--</span></p>
  </div>

      <a href="users.html" id="uLink" class="btn" style="background:#eee; text-decoration:none; color:#333;"><i class="fas fa-users-cog"></i> Quản lý thành viên</a>
