<script>
const API = "https://smarthome-github-io-7.onrender.com";

// ===== LOAD USER =====
const user = localStorage.getItem("user");
const role = localStorage.getItem("role");

// 🔒 CHẶN CHƯA LOGIN
if(!user){
  alert("Bạn chưa đăng nhập!");
  window.location.href = "index.html";
}

// hiển thị
document.getElementById("user").innerText = user;
document.getElementById("role").innerText = role || "user";

// Ẩn admin nếu không phải admin
if(role !== "admin"){
  document.getElementById("userLink").style.display = "none";
}

// ===== CONTROL =====
async function door(){

  if(!user){
    alert("Vui lòng đăng nhập!");
    return;
  }

  await fetch(API + "/door", {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      user: user
    })
  })
}

async function light(s){

  if(!user){
    alert("Vui lòng đăng nhập!");
    return;
  }

  await fetch(API + "/light", {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      user: user,
      state: s
    })
  })
}

// ===== STATUS =====
async function update(){
  let r = await fetch(API + "/status");
  let d = await r.json();
  document.getElementById("state").innerText =
    "Device: " + (d.result || "--");
}

setInterval(update, 1000);
update();

// ===== LOGOUT =====
function logout(){
  localStorage.clear();
  window.location.href = "index.html";
}
</script>
