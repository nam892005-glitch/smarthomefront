<script>
const token = localStorage.getItem("token");

// ===== CHECK TOKEN =====
if(!token || token === "undefined" || token === "null"){
  alert("Chưa đăng nhập!");
  window.location.href = "index.html";
}

// ===== SET USER INFO =====
const userEl = document.getElementById("user");
const roleEl = document.getElementById("role");

userEl.innerText = localStorage.getItem("user") || "--";
roleEl.innerText = localStorage.getItem("role") || "--";

// hide user menu nếu không phải admin
if(roleEl.innerText !== "admin"){
  const link = document.getElementById("uLink");
  if(link) link.style.display = "none";
}

// ===== HELPER FETCH =====
async function apiFetch(url, options = {}){
  try{
    const res = await fetch(API + url, {
      ...options,
      headers:{
        ...(options.headers || {}),
        "Authorization": "Bearer " + token
      }
    });

    // 🔥 xử lý token hết hạn
    if(res.status === 401){
      alert("Phiên đăng nhập hết hạn!");
      logout();
      return null;
    }

    return res;

  }catch(e){
    console.error("FETCH ERROR:", e);
    alert("Không kết nối được server!");
    return null;
  }
}

// ===== API CALL =====
async function door(){
  const res = await apiFetch("/door", { method:"POST" });
  if(res) console.log("Door OK");
}

async function light(state){
  const res = await apiFetch("/light", {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body: JSON.stringify({state})
  });

  if(res) console.log("Light:", state);
}

// ===== STATUS =====
async function loadStatus(){
  try{
    let r = await fetch(API + "/status");
    if(!r.ok) return;

    let d = await r.json();
    document.getElementById("state").innerText = "Trạng thái: " + (d.result || "--");

  }catch(e){
    console.error("STATUS ERROR:", e);
  }
}

setInterval(loadStatus, 1000);
loadStatus();

// ===== LOGOUT =====
function logout(){
  localStorage.clear();
  window.location.href = "index.html";
}
</script>
