<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h2>Dashboard</h2>

<p>User: <b id="user"></b></p>
<p>Role: <b id="role"></b></p>

<button class="btn btn-primary" onclick="door()">Open Door</button>
<button class="btn btn-soft" onclick="light('ON')">Light ON</button>
<button class="btn btn-ghost" onclick="light('OFF')">Light OFF</button>

<h3 id="state">--</h3>

<a href="users.html">Users</a> |
<a href="logs.html">Logs</a> |
<a href="#" onclick="logout()">Logout</a>

</div>

<script>
const API = "https://smarthome-github-io-7.onrender.com";

// 🔥 CHẶN CHƯA LOGIN
if(!localStorage.getItem("user")){
  location.href = "index.html";
}

const user = localStorage.getItem("user");
const role = localStorage.getItem("role");

document.getElementById("user").innerText = user;
document.getElementById("role").innerText = role;

// ===== CONTROL =====
async function door(){
  await fetch(API + "/door", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({user:user})
  })
}

async function light(s){
  await fetch(API + "/light", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      user:user,
      state:s
    })
  })
}

// ===== STATUS =====
async function update(){
  let r = await fetch(API + "/status");
  let d = await r.json();
  document.getElementById("state").innerText =
    "Device: " + (d.result || "--");
}

setInterval(update,1000);
update();

function logout(){
  localStorage.clear();
  location.href="index.html";
}
</script>

</body>
</html>
