<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartHome Login</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="center">

<div class="card">
  <h2>🔐 SmartHome</h2>

  <form onsubmit="login(event)">
    <input id="user" placeholder="Username" required>
    <input id="pass" type="password" placeholder="Password" required>
    <button>Login</button>
  </form>

  <p id="msg"></p>
</div>

<script>
const API = "https://smarthome-github-io-7.onrender.com";

function login(e){
  e.preventDefault();

  fetch(API + "/login", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      username: user.value,
      password: pass.value
    })
  })
  .then(r=>r.json())
  .then(d=>{
    if(d.success){
      localStorage.setItem("user", d.user);
      localStorage.setItem("role", d.role);
      location.href="dashboard.html";
    } else {
      msg.innerText = "Sai tài khoản";
    }
  });
}
</script>

</body>
</html>
