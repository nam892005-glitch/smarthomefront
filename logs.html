<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Logs</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
<h2>Logs</h2>
<ul id="list"></ul>
</div>

<script>
const API = "https://smarthome-github-io-7.onrender.com";

async function load(){
  let r = await fetch(API+"/logs");
  let d = await r.json();

  let list = document.getElementById("list");
  list.innerHTML="";

  d.logs.forEach(log=>{
    let li = document.createElement("li");
    li.innerText = log.time + " | " + log.user;
    list.appendChild(li);
  });
}

setInterval(load,2000);
load();
</script>

</body>
</html>
