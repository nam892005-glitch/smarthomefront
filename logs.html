<!doctype html>
<html>
<head>
  <title>Logs</title>
</head>
<body>

<h2>Logs</h2>
<ul id="logs"></ul>

<script>
const API = "https://smarthome-github-io-7.onrender.com";

fetch(API + "/logs")
.then(r=>r.json())
.then(data=>{
  let html="";
  data.forEach(l=>{
    html += "<li>"+l.user+" - "+l.action+"</li>";
  });
  document.getElementById("logs").innerHTML = html;
});
</script>

</body>
</html>
