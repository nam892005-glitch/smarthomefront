async function load(){
  let r = await fetch(API+"/logs", { headers:{Authorization:token} });
  let d = await r.json();

  // Dùng .map() để tạo danh sách - Rất dễ dạy cho học sinh
  list.innerHTML = d.logs.reverse().map(log => `
    <li>
      <span style="color:#666; font-size: 0.9rem;">${log.time}</span>
      <strong>${log.user}</strong>
      <span class="badge" style="background: #e1f5fe; color: #01579b;">${log.action}</span>
    </li>
  `).join('');
}
