<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
  <title>Logs</title>
</head>
<body>

<h2>📊 Lịch sử sử dụng</h2>

<a href="dashboard.html">🏠 Dashboard</a> |
<a href="users.html">👑 User</a>

<table border="1">
  <thead>
    <tr>
      <th>Time</th>
      <th>User</th>
      <th>Device</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="logTable"></tbody>
</table>

<script>
const API = "https://otherguess-contracted-ezequiel.ngrok-free.dev"

function loadLogs(){
  fetch(API + "/logs")
    .then(res => res.json())
    .then(data => {
      let html = ""

      data.logs.forEach(log => {
        html += `
          <tr>
            <td>${log.time}</td>
            <td>${log.user}</td>
            <td>${log.device}</td>
            <td>${log.action}</td>
          </tr>
        `
      })

      document.getElementById("logTable").innerHTML = html
    })
}

loadLogs()
setInterval(loadLogs, 2000)
</script>

</body>
</html>
