<!doctype html>
<html>
<head>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>

<body>
<div class="container">

<h2>📜 Logs</h2>
<ul id="list"></ul>

</div>

<script>
const token = localStorage.getItem("token");

async function load(){
  let r = await fetch(API+"/logs",{
    headers:{Authorization:token}
  });

  let d = await r.json();

  list.innerHTML="";
  d.logs.forEach(log=>{
    list.innerHTML += `
      <li>${log.time} - ${log.user} - ${log.action}</li>
    `;
  });
}

load();
</script>
</body>
</html>
