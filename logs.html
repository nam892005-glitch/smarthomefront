<script>
const token = localStorage.getItem("token");

// 🔥 FIX check token
if(!token || token === "undefined" || token === "null"){
  alert("Chưa đăng nhập!");
  location.href="index.html";
}

// set user info
document.getElementById("user").innerText = localStorage.getItem("user");
document.getElementById("role").innerText = localStorage.getItem("role");

// hide user menu nếu không phải admin
if(localStorage.getItem("role") !== "admin"){
  document.getElementById("uLink").style.display="none";
}

// ===== LOAD LOGS =====
async function load(){
  try{
    let r = await fetch(API+"/logs",{
      headers:{
        "Authorization": "Bearer " + token
      }
    });

    // 🔥 nếu token sai → logout luôn
    if(r.status === 401){
      logout();
      return;
    }

    let d = await r.json();

    const logList = document.getElementById("logList");
    logList.innerHTML = "";

    d.logs.forEach(log=>{
      logList.innerHTML += `
        <tr>
          <td>${log.time}</td>
          <td>${log.user}</td>
          <td>${log.action}</td>
        </tr>
      `;
    });

  }catch(e){
    console.error("LOAD LOG ERROR:", e);
  }
}

// ===== LOGOUT =====
function logout(){
  localStorage.clear();
  location.href="index.html";
}

// auto reload logs
load();
setInterval(load,5000);
</script>
