<!doctype html>
<html>
<head>
  <title>Users</title>
</head>
<body>

<h2>Users</h2>
<ul id="list"></ul>

<script>
const API = "https://smarthome-github-io-7.onrender.com";

fetch(API + "/users")
.then(r=>r.json())
.then(data=>{
  let html="";
  data.forEach(u=>{
    html += "<li>"+u.username+" ("+u.role+")</li>";
  });
  document.getElementById("list").innerHTML = html;
});
</script>

</body>
</html>
