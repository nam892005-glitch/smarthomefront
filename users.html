async function load(){
  let r = await fetch(API+"/users", { headers:{Authorization:token} });
  let d = await r.json();

  list.innerHTML = d.users.map(u => `
    <li>
      <div>
        <strong>${u.username}</strong> 
        <small style="color: #999;">(${u.role})</small>
      </div>
      <button class="btn-danger" onclick="del('${u.username}')" 
              style="padding: 5px 10px; border-radius: 5px;">
        <i class="fas fa-trash"></i>
      </button>
    </li>
  `).join('');
}
