<script>
const token = localStorage.getItem("token");

// 🔥 check token
if(!token || token === "undefined" || token === "null"){
  alert("Chưa đăng nhập!");
  location.href="index.html";
}

// set info
document.getElementById("user").innerText = localStorage.getItem("user");
document.getElementById("role").innerText = localStorage.getItem("role");

// 🔥 chỉ admin mới được vào trang này
if(localStorage.getItem("role") !== "admin"){
  alert("Bạn không có quyền truy cập!");
  location.href="dashboard.html";
}

// ===== LOAD USERS =====
async function load(){
  try{
    let r = await fetch(API+"/users",{
      headers:{
        "Authorization": "Bearer " + token
      }
    });

    if(r.status === 401 || r.status === 403){
      logout();
      return;
    }

    let d = await r.json();

    const userList = document.getElementById("userList");
    userList.innerHTML = "";

    d.users.forEach(u=>{
      userList.innerHTML += `
        <tr>
          <td>${u.username}</td>
          <td>${u.role}</td>
          <td>
            <button class="btn btn-ghost" onclick="delUser('${u.username}')">
              Xóa
            </button>
          </td>
        </tr>
      `;
    });

  }catch(e){
    console.error("LOAD USERS ERROR:", e);
  }
}

// ===== ADD USER =====
async function add(){
  try{
    let res = await fetch(API+"/add_user",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({
        username: document.getElementById("u").value.trim(),
        password: document.getElementById("p").value.trim(),
        role: document.getElementById("r").value
      })
    });

    if(res.status === 401 || res.status === 403){
      logout();
      return;
    }

    alert("Thêm user thành công!");
    document.getElementById("u").value="";
    document.getElementById("p").value="";

    load();

  }catch(e){
    console.error("ADD USER ERROR:", e);
  }
}

// ===== DELETE USER =====
async function delUser(name){
  if(!confirm("Xóa user " + name + "?")) return;

  try{
    let res = await fetch(API+"/delete/"+name,{
      method:"DELETE",
      headers:{
        "Authorization": "Bearer " + token
      }
    });

    if(res.status === 401 || res.status === 403){
      logout();
      return;
    }

    load();

  }catch(e){
    console.error("DELETE USER ERROR:", e);
  }
}

// ===== LOGOUT =====
function logout(){
  localStorage.clear();
  location.href="index.html";
}

// load data
load();
</script>
