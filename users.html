<!doctype html>
<html>
<head>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<title>Quản lý Users</title>
</head>
<body>

<div class="sidebar">
  <h2>🏠 SmartHome</h2>
  <a href="dashboard.html">Dashboard</a>
  <a href="logs.html">📜 Logs</a>
  <a href="users.html">👤 Users</a>
  <a href="#" onclick="logout()">🚪 Logout</a>
</div>

<div class="main">
  <div class="topbar">
    <div>User: <span class="badge" id="user"></span></div>
    <div>Role: <span class="badge" id="role"></span></div>
  </div>

  <div class="card">
    <h3>Thêm User mới</h3>
    <input id="u" placeholder="Username">
    <input id="p" placeholder="Password">
    <select id="r">
      <option value="user">User</option>
      <option value="admin">Admin</option>
    </select>
    <button class="btn btn-primary" onclick="add()">Thêm User</button>
  </div>

  <div class="card">
    <h3>Danh sách Users</h3>
    <table>
      <thead>
        <tr><th>Username</th><th>Role</th><th>Action</th></tr>
      </thead>
      <tbody id="userList"></tbody>
    </table>
  </div>
</div>

<script>
const token = localStorage.getItem("token");
if(!token) location.href="index.html";
user.innerText = localStorage.getItem("user");
role.innerText = localStorage.getItem("role");

async function load(){
  let r = await fetch(API+"/users",{headers:{Authorization:token}});
  let d = await r.json();
  userList.innerHTML="";
  d.users.forEach(u=>{
    userList.innerHTML += `
      <tr>
        <td>${u.username}</td>
        <td>${u.role}</td>
        <td><button class="btn btn-ghost" onclick="del('${u.username}')">Xóa</button></td>
      </tr>
    `;
  });
}

async function add(){
  await fetch(API+"/add_user",{
    method:"POST",
    headers:{"Content-Type":"application/json", Authorization:token},
    body: JSON.stringify({ username:u.value, password:p.value, role:r.value })
  });
  u.value=""; p.value="";
  load();
}

async function del(name){
  if(!confirm("Xóa user "+name+"?")) return;
  await fetch(API+"/delete/"+name,{method:"DELETE", headers:{Authorization:token}});
  load();
}

function logout(){ localStorage.clear(); location.href="index.html"; }

load();
</script>
</body>
</html>
