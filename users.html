<script>
const API = "https://smarthome-github-io-7.onrender.com";

// 🔐 CHECK LOGIN + ROLE
if(!localStorage.getItem("user")) location="index.html";

if(localStorage.getItem("role") !== "admin"){
  alert("Bạn không có quyền vào trang này!");
  location = "dashboard.html";
}

// LOAD USERS
async function loadUsers(){
  try{
    let res = await fetch(API + "/users");
    let data = await res.json();

    let table = document.getElementById("userTable");
    let empty = document.getElementById("empty");

    table.innerHTML = "";

    if(!data.users || data.users.length === 0){
      empty.innerText = "Chưa có user";
      return;
    }

    empty.style.display = "none";

    data.users.forEach(u=>{
      let tr = document.createElement("tr");

      tr.innerHTML = `
        <td><b>${u.username}</b></td>
        <td class="${u.role==='admin'?'role-admin':'role-member'}">${u.role}</td>
        <td>
          <button class="btn btn-del" onclick="delUser('${u.username}')">
            X
          </button>
        </td>
      `;

      table.appendChild(tr);
    });

  }catch(e){
    document.getElementById("empty").innerText = "Lỗi server!";
  }
}

// ADD USER
async function addUser(){
  let u = document.getElementById("u").value.trim();
  let p = document.getElementById("p").value.trim();
  let r = document.getElementById("r").value;

  if(!u || !p){
    alert("Nhập đủ username + password!");
    return;
  }

  try{
    let res = await fetch(API + "/add_user",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({username:u, password:p, role:r})
    });

    let d = await res.json();

    if(d.success){
      alert("Thêm thành công");
      loadUsers();
    } else {
      alert(d.message || "Lỗi!");
    }

  }catch(e){
    alert("Server lỗi!");
  }
}

// DELETE
async function delUser(u){
  if(!confirm("Xóa user " + u + " ?")) return;

  try{
    await fetch(API + "/delete/" + u,{
      method:"DELETE"
    });

    loadUsers();

  }catch(e){
    alert("Lỗi server!");
  }
}

loadUsers();
</script>
