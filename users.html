<script src="config.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {

const token = localStorage.getItem("token");
const role = localStorage.getItem("role");

if(!token || role !== "admin"){
  alert("Bạn không có quyền truy cập!");
  window.location.href = "dashboard.html";
  return;
}

async function apiFetch(url, options = {}){
  try{
    const res = await fetch(API + url, {
      ...options,
      headers:{
        ...(options.headers || {}),
        "Authorization": "Bearer " + token
      }
    });
    if(res.status === 401 || res.status === 403){
      alert("Phiên đăng nhập không hợp lệ!");
      logout();
      return null;
    }
    return res;
  }catch(e){
    console.error("FETCH ERROR:", e);
    alert("Không kết nối được server!");
    return null;
  }
}

async function load(){
  const res = await apiFetch("/users");
  if(!res) return;
  const data = await res.json();
  const userList = document.getElementById("userList");
  if(!userList) return;
  userList.innerHTML = "";

  if(!data.users || data.users.length === 0){
    userList.innerHTML = `<tr><td colspan="3" style="text-align:center;">Không có user</td></tr>`;
    return;
  }

  data.users.forEach(u=>{
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${u.username || "--"}</td>
      <td>${u.role || "--"}</td>
      <td>
        ${u.username !== "admin" ? `<button onclick="delUser('${u.username}')">Xóa</button>` : "<span style='color:gray'>Protected</span>"}
      </td>
    `;
    userList.appendChild(row);
  });
}

window.add = async function(){
  const username = document.getElementById("u").value.trim();
  const password = document.getElementById("p").value.trim();
  const role = document.getElementById("r").value;

  if(!username || !password){
    alert("Vui lòng nhập đầy đủ!");
    return;
  }

  const res = await apiFetch("/add_user", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ username, password, role })
  });

  if(!res) return;
  alert("Thêm user thành công!");
  document.getElementById("u").value = "";
  document.getElementById("p").value = "";
  load();
}

window.delUser = async function(name){
  if(!confirm("Xóa user " + name + "?")) return;
  const res = await apiFetch("/delete/" + name, { method:"DELETE" });
  if(!res) return;
  load();
}

window.logout = function(){
  localStorage.clear();
  window.location.href = "index.html";
}

load();
});
</script>
